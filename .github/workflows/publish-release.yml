# partially taken from ModMenu's release workflow

name: Publish new Release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    strategy:
      matrix:
        java: [21]
        distro: [temurin]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: '0'
      - name: Check Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}
      - name: Build
        run: ./gradlew build
      - name: Find release artifacts
        run: |
          {
            echo 'RELEASE_ARTIFACTS<<EOF'
            find build/libs/ -type f \! -name "*-sources.jar"
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Get tag message
        run: |
          {
            echo 'GITHUB_TAG_CHANGELOG<<EOF'
            git tag -l --format='%(contents)' ${{ github.ref_name }}
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Publish release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ARTIFACTS }}
          body: ${{ env.GIT_TAG_CHANGELOG }}
          make_latest: "true"
      - name: Publish release to Modrinth
        run: ./gradlew modrinth modrinthSyncBody
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GIT_TAG_CHANGELOG: ${{ env.GIT_TAG_CHANGELOG }}
