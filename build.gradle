plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
}

import org.kohsuke.github.GitHub
import org.kohsuke.github.GHReleaseBuilder

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

def mcVersionsList = project.supported_mc_versions.split(" ").toList()

base {
    archivesName = project.archives_base_name
}

configurations {
    includeClasspath
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modApi include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_api_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation include(fabricApi.module("fabric-api-base", project.fabric_version))
    modImplementation include(fabricApi.module("fabric-resource-loader-v0", project.fabric_version))
    modImplementation include(fabricApi.module("fabric-key-binding-api-v1", project.fabric_version))
    modImplementation fabricApi.module("fabric-screen-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    include (implementation "com.fasterxml.jackson.core:jackson-core:${project.jackson_version}")
    include (implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-toml:${project.jackson_version}")
}

loom {
    accessWidenerPath = file("src/main/resources/cookeymod.accesswidener")
}

processResources {
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from "LICENSE"
    from {
        configurations.includeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "cookeymod"
    versionName = "CookeyMod $project.version for Minecraft ${mcVersionsList.join(", ")}"
    uploadFile = remapJar
    gameVersions = mcVersionsList
    changelog = System.getenv("GIT_TAG_CHANGELOG")
    dependencies {
        optional.project "modmenu"
    }
    syncBodyFrom = project.file("README.md").text
}

tasks.register("github") {
    group = "publishing"
    dependsOn build

    def artifact = layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}.jar").get().asFile
    def modVersion = version
    doLast {
        def github = GitHub.connectUsingOAuth(System.getenv("GITHUB_TOKEN"))
        def repository = github.getRepository("rizecookey/CookeyMod")

        def releaseBuilder = new GHReleaseBuilder(repository, System.getenv("GIT_TAG"))
        def release = releaseBuilder.name("[$modVersion] CookeyMod for Minecraft version ${mcVersionsList.join("/")}")
            .body(System.getenv("GIT_TAG_CHANGELOG"))
            .makeLatest(GHReleaseBuilder.MakeLatest.TRUE)
            .create()

        release.uploadAsset(artifact, "application/java-archive")
    }
}