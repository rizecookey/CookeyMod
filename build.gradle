plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.0.0"
}

version = project.mod_version + "+" + project.minecraft_version
group = project.maven_group

def mcVersionsList = project.supported_mc_versions.split(" ").toList()

base {
    archivesName = project.archives_base_name
}

configurations {
    includeClasspath
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modApi include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_api_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation include(fabricApi.module("fabric-api-base", project.fabric_version))
    modImplementation include(fabricApi.module("fabric-resource-loader-v0", project.fabric_version))
    modImplementation include(fabricApi.module("fabric-resource-loader-v1", project.fabric_version))
    modImplementation include(fabricApi.module("fabric-key-binding-api-v1", project.fabric_version))
    modImplementation fabricApi.module("fabric-screen-api-v1", project.fabric_version)
    modImplementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    includeInternal (implementation "com.fasterxml.jackson.core:jackson-core:${project.jackson_version}")
    includeInternal (implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-toml:${project.jackson_version}")
}

loom {
    accessWidenerPath = file("src/main/resources/cookeymod.accesswidener")
}

processResources {
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from "LICENSE"
    from {
        configurations.includeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

publishMods {
    displayName = "CookeyMod ${project.version} for Minecraft ${mcVersionsList.join(", ")}"
    changelog = providers.environmentVariable("GIT_TAG_CHANGELOG")
    type = STABLE
    file = remapJar.archiveFile
    modLoaders.add("fabric")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "LF4WFeMi"
        minecraftVersions.addAll(mcVersionsList)
        projectDescription = providers.fileContents(layout.projectDirectory.file("README.md")).asText

        optional {
            slug = "modmenu"
        }
    }

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "rizecookey/CookeyMod"
        tagName = providers.environmentVariable("GIT_TAG")
        commitish = providers.environmentVariable("GIT_COMMIT_SHA")
    }
}